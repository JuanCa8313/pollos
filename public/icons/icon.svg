<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1711" />
      <stop offset="100%" stop-color="#0E0D0C" />
    </linearGradient>
    <linearGradient id="birdGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="50%" stop-color="#F97316" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>
    <linearGradient id="crestGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#EF4444" />
      <stop offset="100%" stop-color="#DC2626" />
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#EA580C" stop-opacity="0.9" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#F97316" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="496" height="496" x="8" y="8" rx="104" fill="none" stroke="url(#ringGrad)" stroke-width="4" stroke-opacity="0.4"/>
  <circle cx="256" cy="256" r="185" fill="#1C1814" stroke="#3D2E20" stroke-width="3"/>

  <g filter="url(#glow)" transform="translate(0, -10)">
    <!-- Cuerpo de Pollo de Engorde -->
    <path d="M220,130 C160,130 130,190 130,270 C130,345 180,390 260,390 C340,390 380,340 380,270 C380,210 350,170 300,150 C290,135 260,130 220,130 Z" fill="url(#birdGrad)"/>
    <!-- Cresta -->
    <path d="M210,135 C205,100 225,85 238,85 C246,85 252,92 252,102 C260,94 270,92 278,96 C286,100 288,110 284,122 C296,120 304,128 302,142 C295,152 280,155 265,155 Z" fill="url(#crestGrad)"/>
    <!-- Pico -->
    <polygon points="310,180 350,195 310,210" fill="#FBBF24"/>
    <!-- Ojo -->
    <circle cx="275" cy="182" r="9" fill="#0E0D0C"/>
    <circle cx="277" cy="180" r="3.5" fill="#FFFFFF"/>
    <!-- Ala -->
    <path d="M190,240 C170,260 170,310 210,340 C250,370 300,340 310,310 C320,280 290,250 250,240 C220,230 200,230 190,240 Z" fill="#C2410C" fill-opacity="0.35"/>
    <!-- Barbilla roja -->
    <path d="M305,215 C312,224 310,238 300,244 C290,248 284,238 286,226 Z" fill="url(#crestGrad)"/>
  </g>

  <!-- Tag inferior POLLOS -->
  <rect x="156" y="416" width="200" height="34" rx="17" fill="#EA580C" />
  <text x="256" y="439" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">POLLOS</text>
</svg>